name: CI

# Lint, unit tests, production build, and the Playwright suite on every
# push and PR. Mirrors the setup-node block in refresh-data.yml (Node 22).
#
# Branch protection (repo Settings -> Branches) should require `unit`,
# `build`, and `e2e`. Leave `visual` OUT of the required set: it runs a
# real screenshot comparison against the committed Linux baselines in
# e2e/*-snapshots (regenerated on this runner via `workflow_dispatch`
# with update_visual_baselines: true), and it fails loudly on a diff so
# a reviewer sees the red X — it just doesn't block merge.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Regenerate and commit the Playwright visual baselines'
        type: boolean
        default: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # playwright.config.js `webServer` runs `npm run build && npm run
      # start` on port 3123, so no separate build/serve step is needed.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Screenshot-diff signal — advisory (not in branch protection), but it
  # DOES fail on a real diff so the red X and the uploaded report are
  # visible on the PR. On a normal push/PR this compares the same tree
  # `e2e` builds against the committed Linux baselines.
  visual:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Compare against committed baselines
        if: github.event.inputs.update_visual_baselines != 'true'
        run: npm run test:e2e:visual
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Manual-only: regenerate the Linux baselines on this runner image and
  # commit them back to the dispatched branch. Kept as its own job so its
  # failures are never masked and it never runs on a push/PR.
  regen-visual-baselines:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_visual_baselines == 'true'
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Regenerate and commit baselines
        run: |
          set -euo pipefail
          npm run test:e2e:visual -- --update-snapshots
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # -A past the .gitignore: stages adds, edits, AND deletions of
          # obsolete baselines (a removed/renamed page). Dev machines still
          # can't commit their own platform's renders — the path is ignored.
          git add -fA e2e/*-snapshots
          if git diff --cached --quiet; then
            echo 'no baseline changes'; exit 0
          fi
          git commit -m 'chore: regenerate Playwright visual baselines on the CI runner'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
