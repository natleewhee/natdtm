name: CI

# Lint, unit tests, and production build on every push and PR.
# Mirrors the setup-node block in refresh-data.yml (Node 22, npm cache).
#
# Branch protection must be configured (repo Settings -> Branches) to
# require the `unit` and `build` checks before merge. The `e2e` job is a
# placeholder until the Playwright harness lands (plan unit U4); it runs
# `test:e2e` only if that script exists, so it is a no-op until then and
# activates automatically once U4 adds the script and its full recipe
# (playwright install -> build -> serve -> test:e2e).

on:
  push:
  pull_request:
  workflow_dispatch: {} # manual run: also regenerates visual baselines on the CI runner image

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # playwright.config.js `webServer` runs `npm run build && npm run
      # start` on port 3123, so no separate build/serve step is needed.
      - run: npm run test:e2e
      - name: Regenerate visual baselines (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install chromium && npm run test:e2e:visual -- --update-snapshots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
