name: CI

# Lint, unit tests, production build, and the Playwright suite on every
# push and PR. Mirrors the setup-node block in refresh-data.yml (Node 22).
#
# Branch protection (repo Settings -> Branches) should require the `unit`,
# `build`, and `e2e` checks before merge. `visual` is intentionally not a
# required check — it is a screenshot-diff signal for reviewers, and its
# baselines are regenerated on the runner image via `workflow_dispatch`.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Regenerate and commit the Playwright visual baselines'
        type: boolean
        default: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # playwright.config.js `webServer` runs `npm run build && npm run
      # start` on port 3123, so no separate build/serve step is needed.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Screenshot-diff signal. Non-blocking: it has no baselines until a
  # maintainer runs this workflow with `update_visual_baselines: true`,
  # which regenerates them on this runner image and commits them back.
  visual:
    runs-on: ubuntu-latest
    needs: unit
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      - name: Compare against committed baselines
        if: github.event.inputs.update_visual_baselines != 'true'
        run: npm run test:e2e:visual

      - name: Regenerate and commit baselines
        if: github.event.inputs.update_visual_baselines == 'true'
        run: |
          npm run test:e2e:visual -- --update-snapshots
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # -f: the snapshot dir is gitignored so dev machines don't commit
          # their platform's renders; only this runner's Linux baselines land.
          git add -f e2e/*-snapshots
          git commit -m 'chore: regenerate Playwright visual baselines on the CI runner' || echo 'no baseline changes'
          git push

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
